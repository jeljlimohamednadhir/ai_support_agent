# Kubernetes Deployment - Worker
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels:
    app: ai-support-agent
    component: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-support-agent
      component: worker
  template:
    metadata:
      labels:
        app: ai-support-agent
        component: worker
    spec:
      containers:
      - name: worker
        image: ai-support-agent/worker:latest
        env:
        - name: CELERY_BROKER_URL
          value: redis://redis-service:6379/0
        - name: CELERY_RESULT_BACKEND
          value: redis://redis-service:6379/0
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"

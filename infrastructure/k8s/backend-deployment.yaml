# Kubernetes Deployment - Backend
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: ai-support-agent
    component: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ai-support-agent
      component: backend
  template:
    metadata:
      labels:
        app: ai-support-agent
        component: backend
    spec:
      containers:
      - name: backend
        image: ai-support-agent/backend:latest
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: ai-support-secrets
              key: database-url
        - name: REDIS_HOST
          value: redis-service
        - name: NEO4J_URI
          value: bolt://neo4j-service:7687
        - name: QDRANT_HOST
          value: qdrant-service
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  selector:
    app: ai-support-agent
    component: backend
  ports:
  - protocol: TCP
    port: 8000
    targetPort: 8000
  type: ClusterIP

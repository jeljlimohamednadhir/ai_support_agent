<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="g1" x1="0" x2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000" flood-opacity="0.25"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 L3,6 z" fill="#94a3b8" />
    </marker>
  </defs>

  <style>
    .bg { fill: #0b1220; }
    .card { fill: #07102a; stroke: url(#g1); stroke-width: 2; rx: 14px; filter: url(#shadow); }
    .title { font: 700 20px 'Segoe UI', Roboto, Arial; fill: #e6eef8; }
    .subtitle { font: 600 13px 'Segoe UI', Roboto, Arial; fill: #9fb0c9; }
    .body { font: 500 12px 'Segoe UI', Roboto, Arial; fill: #cbd7e6; }
    .stepnum { font: 700 30px 'Segoe UI', Roboto, Arial; fill: #0b1220; }
    .connector { stroke: #94a3b8; stroke-width: 3; fill: none; marker-end: url(#arrow); }
  </style>

  <rect class="bg" x="0" y="0" width="1600" height="900"/>

  <!-- Header -->
  <text class="title" x="80" y="60">Workflow narratif — AI Support Agent</text>
  <text class="subtitle" x="80" y="85">Étapes racontées : de la collecte à la validation humaine</text>

  <!-- Step 1: Collecte -->
  <g transform="translate(60,120)">
    <rect class="card" width="420" height="160"/>
    <circle cx="60" cy="80" r="40" fill="#60a5fa"/>
    <text class="stepnum" x="60" y="92" text-anchor="middle">1</text>
    <text class="title" x="140" y="50">Collecte</text>
    <text class="body" x="140" y="80">Récupération automatique des sources :</text>
    <text class="body" x="140" y="104">- Repos Git, fichiers de logs, schémas DB, documentation</text>
    <text class="body" x="140" y="128">- Création d'un job de collecte (Postgres)</text>
  </g>

  <!-- Step 2: Workers -->
  <g transform="translate(520,120)">
    <rect class="card" width="420" height="160"/>
    <circle cx="60" cy="80" r="40" fill="#7c3aed"/>
    <text class="stepnum" x="60" y="92" text-anchor="middle">2</text>
    <text class="title" x="140" y="50">Analyse asynchrone</text>
    <text class="body" x="140" y="80">Workers (Celery) traitent les jobs :</text>
    <text class="body" x="140" y="104">- Parsing AST, extraction de fonctions/endpoints</text>
    <text class="body" x="140" y="128">- Génération d'embeddings & normalisation des logs</text>
  </g>

  <!-- Step 3: Indexation -->
  <g transform="translate(980,120)">
    <rect class="card" width="520" height="160"/>
    <circle cx="60" cy="80" r="40" fill="#06b6d4"/>
    <text class="stepnum" x="60" y="92" text-anchor="middle">3</text>
    <text class="title" x="140" y="50">Indexation & Graphe</text>
    <text class="body" x="140" y="80">- Entities & relations → Neo4j</text>
    <text class="body" x="140" y="104">- Documents & snippets → Qdrant (embeddings)</text>
    <text class="body" x="140" y="128">- Métadonnées → PostgreSQL</text>
  </g>

  <!-- Curved connectors (narrative flow) -->
  <path class="connector" d="M200 220 C 320 220, 380 220, 520 220"/>
  <path class="connector" d="M660 220 C 780 220, 900 220, 980 220"/>

  <!-- Step 4: Chatbot -->
  <g transform="translate(300,340)">
    <rect class="card" width="420" height="160"/>
    <circle cx="60" cy="80" r="40" fill="#f59e0b"/>
    <text class="stepnum" x="60" y="92" text-anchor="middle">4</text>
    <text class="title" x="140" y="50">Conversation / RAG</text>
    <text class="body" x="140" y="80">- Recherche sémantique via Qdrant</text>
    <text class="body" x="140" y="104">- Contextualisation avec Neo4j</text>
    <text class="body" x="140" y="128">- Génération de réponse par le LLM</text>
  </g>

  <!-- Step 5: Validation -->
  <g transform="translate(860,340)">
    <rect class="card" width="420" height="160"/>
    <circle cx="60" cy="80" r="40" fill="#10b981"/>
    <text class="stepnum" x="60" y="92" text-anchor="middle">5</text>
    <text class="title" x="140" y="50">Validation Humaine</text>
    <text class="body" x="140" y="80">- Experts relisent & corrigent</text>
    <text class="body" x="140" y="104">- Feedback -> amélioration des règles</text>
    <text class="body" x="140" y="128">- Historique & audit dans PostgreSQL</text>
  </g>

  <!-- Connectors to chat/validation -->
  <path class="connector" d="M760 280 C 740 300, 720 320, 740 340"/>
  <path class="connector" d="M840 340 C 900 340, 920 340, 940 340"/>

  <!-- Footer explanation -->
  <text class="subtitle" x="80" y="860">Histoire :</text>
  <text class="body" x="80" y="885">1) Le système collecte les sources. 2) Les workers analysent et extraient. 3) Les résultats sont indexés (graphe + vecteurs). 4) Le chatbot utilise ces indices pour répondre. 5) Les experts valident et bouclent l'amélioration.</text>

</svg>
<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <style>
    .box { fill: #0f172a; stroke: #60a5fa; stroke-width: 2px; rx: 10px; }
    .title { font: 700 16px 'Segoe UI', Roboto, Arial; fill: #fff; }
    .desc { font: 500 12px 'Segoe UI', Roboto, Arial; fill: #cbd5e1; }
    .arrow { stroke: #94a3b8; stroke-width: 3px; marker-end: url(#arr); }
  </style>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8" />
    </marker>
  </defs>

  <!-- Collector -->
  <rect class="box" x="40" y="60" width="220" height="90" rx="12"/>
  <text class="title" x="150" y="95" text-anchor="middle">Collecte</text>
  <text class="desc" x="150" y="115" text-anchor="middle">Git · Logs · DB · Docs</text>

  <!-- Worker -->
  <rect class="box" x="320" y="60" width="220" height="90" rx="12"/>
  <text class="title" x="430" y="95" text-anchor="middle">Workers</text>
  <text class="desc" x="430" y="115" text-anchor="middle">Parsing · Extraction · Embeddings</text>

  <!-- Knowledge Graph -->
  <rect class="box" x="600" y="60" width="220" height="90" rx="12"/>
  <text class="title" x="710" y="95" text-anchor="middle">Knowledge Graph</text>
  <text class="desc" x="710" y="115" text-anchor="middle">Neo4j (relations & entités)</text>

  <!-- Vector Store -->
  <rect class="box" x="880" y="60" width="220" height="90" rx="12"/>
  <text class="title" x="990" y="95" text-anchor="middle">Vector Store</text>
  <text class="desc" x="990" y="115" text-anchor="middle">Qdrant (embeddings)</text>

  <!-- Chatbot -->
  <rect class="box" x="320" y="220" width="220" height="90" rx="12"/>
  <text class="title" x="430" y="255" text-anchor="middle">Chatbot</text>
  <text class="desc" x="430" y="275" text-anchor="middle">RAG + LLM génératif</text>

  <!-- Validation -->
  <rect class="box" x="600" y="220" width="220" height="90" rx="12"/>
  <text class="title" x="710" y="255" text-anchor="middle">Validation Humaine</text>
  <text class="desc" x="710" y="275" text-anchor="middle">Review · Corrections · Feedback</text>

  <!-- Arrows -->
  <line class="arrow" x1="260" y1="105" x2="320" y2="105"/>
  <line class="arrow" x1="540" y1="105" x2="600" y2="105"/>
  <line class="arrow" x1="820" y1="105" x2="880" y2="105"/>

  <line class="arrow" x1="710" y1="150" x2="710" y2="220"/>
  <line class="arrow" x1="540" y1="265" x2="600" y2="265"/>

  <!-- Footnote -->
  <text class="desc" x="20" y="580">Workflow: Collecte → Workers (analyse) → Knowledge Graph & Vector Store → Chatbot → Validation</text>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <style>
    .node { fill: #0f172a; stroke: #60a5fa; stroke-width: 2px; rx: 8px; }
    .central { fill: #0b1020; stroke: #6366f1; stroke-width: 3px; rx: 14px; }
    .title { font: 700 18px 'Segoe UI', Roboto, Arial; fill: #ffffff; }
    .label { font: 600 13px 'Segoe UI', Roboto, Arial; fill: #e2e8f0; }
    .small { font: 500 11px 'Segoe UI', Roboto, Arial; fill: #cbd5e1; }
    .link { stroke: #94a3b8; stroke-width: 2px; stroke-linecap: round; }
  </style>

  <!-- Central node -->
  <rect class="central" x="520" y="360" width="360" height="80" rx="16"/>
  <text class="title" x="700" y="405" text-anchor="middle">AI Support Agent</text>

  <!-- Frontend -->
  <line class="link" x1="700" y1="360" x2="420" y2="160"/>
  <rect class="node" x="300" y="120" width="240" height="90" rx="10"/>
  <text class="label" x="420" y="150" text-anchor="middle">Frontend (React)</text>
  <text class="small" x="420" y="170" text-anchor="middle">Chatbot · Dashboard · Validation</text>

  <!-- Backend -->
  <line class="link" x1="700" y1="440" x2="700" y2="640"/>
  <rect class="node" x="540" y="660" width="320" height="90" rx="10"/>
  <text class="label" x="700" y="690" text-anchor="middle">Backend (FastAPI)</text>
  <text class="small" x="700" y="710" text-anchor="middle">/chatbot /collector /analyzer /knowledge /validation</text>

  <!-- Collectors -->
  <line class="link" x1="700" y1="360" x2="980" y2="160"/>
  <rect class="node" x="860" y="120" width="240" height="90" rx="10"/>
  <text class="label" x="980" y="150" text-anchor="middle">Collector</text>
  <text class="small" x="980" y="170" text-anchor="middle">Git · Logs · DB · Docs</text>

  <!-- Workers -->
  <line class="link" x1="700" y1="440" x2="420" y2="640"/>
  <rect class="node" x="220" y="660" width="320" height="90" rx="10"/>
  <text class="label" x="380" y="690" text-anchor="middle">Workers (Celery)</text>
  <text class="small" x="380" y="710" text-anchor="middle">Code · Log · DB · Doc Analyzers</text>

  <!-- Knowledge Graph -->
  <line class="link" x1="700" y1="420" x2="1100" y2="420"/>
  <rect class="node" x="1060" y="360" width="240" height="90" rx="10"/>
  <text class="label" x="1180" y="390" text-anchor="middle">Knowledge Graph (Neo4j)</text>
  <text class="small" x="1180" y="410" text-anchor="middle">Nodes & Relations (functions, tables, endpoints)</text>

  <!-- Vector Store -->
  <line class="link" x1="1060" y1="420" x2="1060" y2="600"/>
  <rect class="node" x="1060" y="620" width="240" height="70" rx="10"/>
  <text class="label" x="1180" y="660" text-anchor="middle">Vector Store (Qdrant)</text>
  <text class="small" x="1180" y="678" text-anchor="middle">documents · code_snippets</text>

  <!-- Storage -->
  <rect class="node" x="540" y="540" width="300" height="80" rx="10"/>
  <text class="label" x="690" y="570" text-anchor="middle">PostgreSQL / Redis</text>
  <text class="small" x="690" y="590" text-anchor="middle">Users · Jobs · Cache</text>

  <!-- LLM -->
  <line class="link" x1="1180" y1="690" x2="1180" y2="780"/>
  <rect class="node" x="1040" y="780" width="280" height="80" rx="10"/>
  <text class="label" x="1180" y="815" text-anchor="middle">LLM & Embeddings</text>
  <text class="small" x="1180" y="835" text-anchor="middle">OpenAI · Anthropic · Groq</text>

  <!-- Observability -->
  <rect class="node" x="80" y="40" width="220" height="70" rx="10"/>
  <text class="label" x="190" y="70" text-anchor="middle">Observability</text>
  <text class="small" x="190" y="90" text-anchor="middle">Prometheus · Grafana · ELK · Jaeger</text>

  <!-- Security -->
  <rect class="node" x="1080" y="40" width="220" height="70" rx="10"/>
  <text class="label" x="1190" y="70" text-anchor="middle">Sécurité</text>
  <text class="small" x="1190" y="90" text-anchor="middle">JWT · RBAC · Audit</text>

  <!-- Footnote -->
  <text class="small" x="20" y="880">Généré automatiquement : carte mentale fonctionnelle du projet AI Support Agent</text>
</svg>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Dark Mode</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
        
        // Initialize dark mode
        if (localStorage.getItem('darkMode') === 'true') {
            document.documentElement.classList.add('dark')
        }
        
        function toggleDarkMode() {
            const isDark = document.documentElement.classList.toggle('dark')
            localStorage.setItem('darkMode', isDark)
            console.log('Dark mode:', isDark)
        }
    </script>
</head>
<body class="bg-white dark:bg-gray-900 min-h-screen transition-colors">
    <div class="p-8">
        <h1 class="text-3xl font-bold text-gray-900 dark:text-white mb-4">
            Test Mode Sombre
        </h1>
        <p class="text-gray-600 dark:text-gray-300 mb-6">
            Ce test vérifie que le mode sombre fonctionne correctement.
        </p>
        
        <button 
            onclick="toggleDarkMode()"
            class="px-6 py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-medium transition-colors"
        >
            Toggle Dark Mode
        </button>
        
        <div class="mt-8 p-6 bg-gray-100 dark:bg-gray-800 rounded-lg">
            <h2 class="text-xl font-semibold text-gray-900 dark:text-white mb-2">
                Carte de test
            </h2>
            <p class="text-gray-600 dark:text-gray-400">
                Ce texte devrait changer de couleur en mode sombre.
            </p>
        </div>
        
        <div class="mt-4 text-sm text-gray-500 dark:text-gray-400">
            État: <span id="status" class="font-mono"></span>
        </div>
    </div>
    
    <script>
        function updateStatus() {
            const isDark = document.documentElement.classList.contains('dark')
            document.getElementById('status').textContent = isDark ? 'Mode SOMBRE activé' : 'Mode CLAIR activé'
        }
        updateStatus()
        setInterval(updateStatus, 100)
    </script>
</body>
</html>
